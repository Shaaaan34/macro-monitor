name: Market-close update

on:
  schedule:
    # GitHub Actions cron is UTC and doesn't follow DST, so we fire twice —
    # once for EDT, once for EST — and let scripts/should_run.py decide which
    # one actually lands after today's real NYSE close. A few minutes of
    # buffer is included since scheduled runs can start late.
    - cron: "15 20 * * 1-5"   # ~4:15pm EDT (Mar-Nov)
    - cron: "15 21 * * 1-5"   # ~4:15pm EST (Nov-Mar)
  workflow_dispatch: {}        # manual "Run workflow" button always runs, ignoring the window

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check market-close window (scheduled runs only)
        id: guard
        if: github.event_name == 'schedule'
        run: python scripts/should_run.py
        continue-on-error: true

      - name: Run pipeline
        if: github.event_name != 'schedule' || steps.guard.outcome == 'success'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run.py

      - name: Commit updated dashboard + history
        if: github.event_name != 'schedule' || steps.guard.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs data/history.csv
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Automated market-close update"
          git push
